name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/android/**"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Without the fixed key the APK cannot update existing installs: never publish one.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 manquant — build annulé"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anyloc-release.keystore"

      - name: Build release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/anyloc-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Normalize APK filename
        run: |
          mkdir -p dist/android
          cp apps/android/app/build/outputs/apk/release/*.apk dist/android/Anyloc.apk

      - name: Install root deps
        run: npm ci

      - name: Upload to Vercel Blob
        # Mirror only: downloads come from GitHub releases, so a Blob outage
        # (e.g. suspended store) must not block publishing the release.
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs android dist/android/Anyloc.apk
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc Android v0.1.${{ github.run_number }}" --generate-notes --latest=false
          gh release upload "$TAG" dist/android/Anyloc.apk --clobber

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: anyloc-android-apk
          path: dist/android/Anyloc.apk
          if-no-files-found: error
