name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        working-directory: apps/android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-android-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Keep APK for release
        run: |
          mkdir -p /tmp/android-release
          cp apps/android/app/build/outputs/apk/release/*.apk /tmp/android-release/Anyloc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: /tmp/android-release/Anyloc.apk
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: Anyloc Android v0.1.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/Anyloc.apk

      - name: Print download URL
        run: |
          TAG="android-v0.1.${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          echo "ANYLOC_DOWNLOAD_APK=${BASE}/Anyloc.apk" >> $GITHUB_STEP_SUMMARY
