name: Build Anyloc Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/setup/**"
      - "apps/ios/**"
      - "scripts/build-setup.sh"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-setup.yml"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install dependencies
        working-directory: apps/setup
        run: npm install

      - name: Bundle latest Anyloc.ipa (if published)
        shell: bash
        run: |
          mkdir -p apps/ios/dist
          URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: anyloc-setup-build" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" \
            | python3 -c "import json,sys; releases=json.load(sys.stdin); \
          url=next((a['browser_download_url'] for r in releases for a in r.get('assets',[]) if a.get('name')=='Anyloc.ipa'), None); \
          print(url or '')")
          if [ -n "$URL" ]; then
            curl -fsSL -o apps/ios/dist/Anyloc.ipa "$URL"
            echo "Bundled Anyloc.ipa from $URL"
          else
            echo "No Anyloc.ipa in releases yet — Setup will download it at runtime."
          fi

      - name: Build macOS DMG
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-mac
          path: apps/setup/dist/Anyloc-Setup.dmg
          if-no-files-found: error

      - name: Upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-mac apps/setup/dist/Anyloc-Setup.dmg
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Keep DMG for release
        run: mkdir -p /tmp/setup-release && cp apps/setup/dist/Anyloc-Setup.dmg /tmp/setup-release/

      - uses: actions/upload-artifact@v4
        with:
          name: setup-release-mac
          path: /tmp/setup-release/Anyloc-Setup.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install dependencies
        working-directory: apps/setup
        run: npm install

      - name: Build Windows installer
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-win
          path: apps/setup/dist/Anyloc-Setup.exe
          if-no-files-found: error

      - name: Upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-win apps/setup/dist/Anyloc-Setup.exe
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Keep EXE for release
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/setup-release"
          cp apps/setup/dist/Anyloc-Setup.exe "$RUNNER_TEMP/setup-release/"

      - uses: actions/upload-artifact@v4
        with:
          name: setup-release-win
          path: ${{ runner.temp }}/setup-release/Anyloc-Setup.exe
          if-no-files-found: error

  publish:
    needs: [build-mac, build-win]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: setup-release-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: setup-v0.1.${{ github.run_number }}
          name: Anyloc Setup v0.1.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/Anyloc-Setup.dmg
            release-files/Anyloc-Setup.exe

      - name: Attach Anyloc.ipa to release (if available)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: anyloc-setup-build" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" \
            | python3 -c "import json,sys; releases=json.load(sys.stdin); \
          url=next((a['browser_download_url'] for r in releases for a in r.get('assets',[]) if a.get('name')=='Anyloc.ipa'), None); \
          print(url or '')")
          if [ -z "$URL" ]; then
            echo "No Anyloc.ipa to attach."
            exit 0
          fi
          curl -fsSL -o /tmp/Anyloc.ipa "$URL"
          TAG="setup-v0.1.${{ github.run_number }}"
          gh release upload "$TAG" /tmp/Anyloc.ipa --clobber

      - name: Print Vercel env vars
        run: |
          TAG="setup-v0.1.${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          echo "## URLs à configurer sur Vercel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ANYLOC_DOWNLOAD_SETUP_MAC=${BASE}/Anyloc-Setup.dmg" >> $GITHUB_STEP_SUMMARY
          echo "ANYLOC_DOWNLOAD_SETUP_WIN=${BASE}/Anyloc-Setup.exe" >> $GITHUB_STEP_SUMMARY
