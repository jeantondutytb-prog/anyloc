name: Build Anyloc Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/setup/**"
      - "apps/ios/**"
      - "scripts/build-setup.sh"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-setup.yml"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install Setup dependencies
        working-directory: apps/setup
        run: npm install

      - name: Bundle latest Anyloc.ipa (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps/ios/dist
          API_URL=$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq '[.[].assets[] | select(.name=="Anyloc.ipa") | .url] | first' \
            || true)
          if [ -n "$API_URL" ] && [ "$API_URL" != "null" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "User-Agent: anyloc-setup-build" \
              -o apps/ios/dist/Anyloc.ipa \
              "$API_URL"
            echo "Bundled Anyloc.ipa"
          else
            echo "No Anyloc.ipa in releases yet — Setup will download it at runtime."
          fi

      - name: Build macOS DMG
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Install root deps
        run: npm ci

      - name: Upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-mac apps/setup/dist/Anyloc.dmg
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="setup-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc Setup v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" apps/setup/dist/Anyloc.dmg --clobber

      - name: Upload DMG artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-mac
          path: apps/setup/dist/Anyloc.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install Setup dependencies
        working-directory: apps/setup
        run: npm install

      - name: Build Windows installer
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Zip installer (Chrome fallback)
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/setup/dist/Anyloc-Setup.exe")) {
            throw "Anyloc-Setup.exe missing after Windows build"
          }
          Compress-Archive -Path "apps/setup/dist/Anyloc-Setup.exe" -DestinationPath "apps/setup/dist/Anyloc-Setup.zip" -Force

      - name: Install root deps
        shell: bash
        run: npm ci

      - name: Upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-win apps/setup/dist/Anyloc-Setup.exe
            node scripts/upload-release.mjs setup-win-zip apps/setup/dist/Anyloc-Setup.zip
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="setup-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc Setup v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" apps/setup/dist/Anyloc-Setup.exe apps/setup/dist/Anyloc-Setup.zip --clobber

      - name: Upload EXE artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-win
          path: |
            apps/setup/dist/Anyloc-Setup.exe
            apps/setup/dist/Anyloc-Setup.zip
          if-no-files-found: error
