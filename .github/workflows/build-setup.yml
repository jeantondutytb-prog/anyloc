name: Build Anyloc Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/setup/**"
      - "scripts/build-setup.sh"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-setup.yml"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install Setup dependencies
        working-directory: apps/setup
        run: npm install

      # electron-builder 25 passes the .p12 password to set-key-partition-list
      # instead of its keychain password, which macOS 26 rejects. Import the
      # Developer ID ourselves and let electron-builder find it by name.
      - name: Import Developer ID certificate
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "MAC_CSC_LINK absent — build non signé"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Notarize with the App Store Connect API key (same one the iOS
      # pipeline uses) rather than an Apple ID + app-specific password.
      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "ASC_PRIVATE_KEY absent — pas de notarisation"
            exit 0
          fi
          # Same normalization as normalizeAscPrivateKey (src/lib/ios-adhoc/app-store-connect.ts).
          node -e '
            const PEM_RE = /-----BEGIN ([A-Z ]+)-----([\s\S]*?)-----END \1-----/;
            function norm(raw) {
              const v = raw.trim().replace(/^["\x27]|["\x27]$/g, "").replace(/\\n/g, "\n").trim();
              const pem = v.match(PEM_RE);
              const label = pem ? pem[1] : "PRIVATE KEY";
              const body = (pem ? pem[2] : v).replace(/\s+/g, "");
              if (!pem) {
                const decoded = Buffer.from(body, "base64").toString("utf8");
                if (PEM_RE.test(decoded)) return norm(decoded);
              }
              return `-----BEGIN ${label}-----\n${body.match(/.{1,64}/g).join("\n")}\n-----END ${label}-----\n`;
            }
            require("fs").writeFileSync(process.argv[1], norm(process.env.ASC_PRIVATE_KEY), { mode: 0o600 });
          ' "$RUNNER_TEMP/asc_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Build macOS DMG
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: npm run build:mac

      - name: Verify signature and notarization
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          if [ -z "$APPLE_IDENTITY" ]; then
            echo "APPLE_IDENTITY absent — build non signé, vérification ignorée"
            exit 0
          fi
          APP=$(find apps/setup/dist -maxdepth 2 -name "Anyloc.app" | head -1)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate apps/setup/dist/Anyloc.dmg || echo "DMG non agrafé (l'app l'est)"

      - name: Install root deps
        run: npm ci

      - name: Upload to Vercel Blob
        # Mirror only: downloads come from GitHub releases, so a Blob outage
        # (e.g. suspended store) must not block publishing the release.
        continue-on-error: true
        # Production download links: never overwrite them from a branch build.
        if: github.ref == 'refs/heads/main'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-mac apps/setup/dist/Anyloc.dmg
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-mac
          path: apps/setup/dist/Anyloc.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install Setup dependencies
        working-directory: apps/setup
        run: npm install

      - name: Build Windows installer
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Zip installer (Chrome fallback)
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/setup/dist/Anyloc-Setup.exe")) {
            throw "Anyloc-Setup.exe missing after Windows build"
          }
          Compress-Archive -Path "apps/setup/dist/Anyloc-Setup.exe" -DestinationPath "apps/setup/dist/Anyloc-Setup.zip" -Force

      - name: Install root deps
        shell: bash
        run: npm ci

      - name: Upload to Vercel Blob
        # Mirror only: downloads come from GitHub releases, so a Blob outage
        # (e.g. suspended store) must not block publishing the release.
        continue-on-error: true
        # Production download links: never overwrite them from a branch build.
        if: github.ref == 'refs/heads/main'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-win apps/setup/dist/Anyloc-Setup.exe
            node scripts/upload-release.mjs setup-win-zip apps/setup/dist/Anyloc-Setup.zip
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-win
          path: |
            apps/setup/dist/Anyloc-Setup.exe
            apps/setup/dist/Anyloc-Setup.zip
          if-no-files-found: error

  # Publish once both installers are built: the site links to
  # releases/latest, so a release missing one asset breaks that download.
  publish-release:
    needs: [build-mac, build-win]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="setup-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Anyloc Setup v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" dist/Anyloc.dmg dist/Anyloc-Setup.exe dist/Anyloc-Setup.zip --clobber
