name: Build Anyloc Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/setup/**"
      - "scripts/build-setup.sh"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-setup.yml"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install Setup dependencies
        working-directory: apps/setup
        run: npm install

      # electron-builder 25 passes the .p12 password to set-key-partition-list
      # instead of its keychain password, which macOS 26 rejects. Import the
      # Developer ID ourselves and let electron-builder find it by name.
      - name: Import Developer ID certificate
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "MAC_CSC_LINK absent — build non signé"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build macOS DMG
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Verify signature and notarization
        if: env.APPLE_IDENTITY != ''
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          APP=$(find apps/setup/dist -maxdepth 2 -name "Anyloc.app" | head -1)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"

      - name: Install root deps
        run: npm ci

      - name: Upload to Vercel Blob
        # Mirror only: downloads come from GitHub releases, so a Blob outage
        # (e.g. suspended store) must not block publishing the release.
        continue-on-error: true
        # Production download links: never overwrite them from a branch build.
        if: github.ref == 'refs/heads/main'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-mac apps/setup/dist/Anyloc.dmg
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="setup-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc Setup v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" apps/setup/dist/Anyloc.dmg --clobber

      - name: Upload DMG artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-mac
          path: apps/setup/dist/Anyloc.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup/package-lock.json

      - name: Install Setup dependencies
        working-directory: apps/setup
        run: npm install

      - name: Build Windows installer
        working-directory: apps/setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Zip installer (Chrome fallback)
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/setup/dist/Anyloc-Setup.exe")) {
            throw "Anyloc-Setup.exe missing after Windows build"
          }
          Compress-Archive -Path "apps/setup/dist/Anyloc-Setup.exe" -DestinationPath "apps/setup/dist/Anyloc-Setup.zip" -Force

      - name: Install root deps
        shell: bash
        run: npm ci

      - name: Upload to Vercel Blob
        # Mirror only: downloads come from GitHub releases, so a Blob outage
        # (e.g. suspended store) must not block publishing the release.
        continue-on-error: true
        # Production download links: never overwrite them from a branch build.
        if: github.ref == 'refs/heads/main'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs setup-win apps/setup/dist/Anyloc-Setup.exe
            node scripts/upload-release.mjs setup-win-zip apps/setup/dist/Anyloc-Setup.zip
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="setup-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc Setup v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" apps/setup/dist/Anyloc-Setup.exe apps/setup/dist/Anyloc-Setup.zip --clobber

      - name: Upload EXE artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-setup-win
          path: |
            apps/setup/dist/Anyloc-Setup.exe
            apps/setup/dist/Anyloc-Setup.zip
          if-no-files-found: error
