name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Desktop app helpers (plain Node, no Electron needed).
      - run: node --test "apps/setup/src/*.test.js"
      # Builds without secrets: every integration is optional at build time.
      - run: npm run build
