name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/ios/**"
      - "scripts/build-ios-ipa.sh"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple team
        id: team
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "has_team=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_DEVELOPMENT_TEAM absent — build iOS ignoré."
            echo "Ajoute le secret GitHub : Settings → Secrets → APPLE_DEVELOPMENT_TEAM"
          else
            echo "has_team=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure code signing keychain
        if: steps.team.outputs.has_team == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Importing signing certificate from BUILD_CERTIFICATE_BASE64..."
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/build_cert.p12
            security import /tmp/build_cert.p12 \
              -k "$KEYCHAIN" \
              -P "${BUILD_CERTIFICATE_PASSWORD:-}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security \
              -T /usr/bin/xcodebuild
            rm -f /tmp/build_cert.p12
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Storing Apple ID credentials for automatic provisioning..."
            xcrun notarytool store-credentials "anyloc-ci" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_DEVELOPMENT_TEAM" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --keychain "$KEYCHAIN"
          else
            echo "::warning::Ni BUILD_CERTIFICATE_BASE64 ni APPLE_ID — xcodebuild tentera -allowProvisioningUpdates sans auth explicite."
          fi

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        if: steps.team.outputs.has_team == 'true'
        run: brew install xcodegen

      - name: Build signed IPA
        if: steps.team.outputs.has_team == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: chmod +x scripts/build-ios-ipa.sh && ./scripts/build-ios-ipa.sh

      - uses: actions/setup-node@v4
        if: steps.team.outputs.has_team == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        if: steps.team.outputs.has_team == 'true'
        run: npm ci

      - name: Upload to Vercel Blob
        if: steps.team.outputs.has_team == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs ios apps/ios/dist/Anyloc.ipa
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.team.outputs.has_team == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc iOS v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" apps/ios/dist/Anyloc.ipa --clobber

      - name: Upload IPA artifact
        if: steps.team.outputs.has_team == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-ios-ipa
          path: apps/ios/dist/Anyloc.ipa
          if-no-files-found: error
