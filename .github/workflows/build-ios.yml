name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
    paths:
      - "apps/ios/**"
      - "scripts/build-ios-ipa.sh"
      - "scripts/prepare-ios-ci-secrets.sh"
      - "scripts/upload-release.mjs"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple team
        id: team
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "has_team=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_DEVELOPMENT_TEAM absent — build iOS ignoré."
          else
            echo "has_team=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure code signing keychain
        if: steps.team.outputs.has_team == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 manquant."
            echo "Sur ton Mac : ./scripts/prepare-ios-ci-secrets.sh"
            echo "Puis ajoute BUILD_CERTIFICATE_BASE64 + BUILD_CERTIFICATE_PASSWORD dans GitHub Secrets."
            exit 1
          fi

          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 manquant."
            echo "Relance ./scripts/prepare-ios-ci-secrets.sh sur ton Mac — il génère aussi le profil io.anyloc.app."
            exit 1
          fi

          echo "Importing signing certificate..."
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${BUILD_CERTIFICATE_PASSWORD:-}" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Installing provisioning profile..."
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_DIR_XCODE="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PP_DIR" "$PP_DIR_XCODE"
          PP_PATH="$RUNNER_TEMP/anyloc.mobileprovision"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$PP_DIR/${PP_UUID}.mobileprovision"
          cp "$PP_PATH" "$PP_DIR_XCODE/${PP_UUID}.mobileprovision"
          echo "Provisioning profile UUID: $PP_UUID"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        if: steps.team.outputs.has_team == 'true'
        run: brew install xcodegen

      - name: Build signed IPA
        if: steps.team.outputs.has_team == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_UUID: ${{ env.PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          chmod +x scripts/build-ios-ipa.sh
          ./scripts/build-ios-ipa.sh

      - uses: actions/setup-node@v4
        if: steps.team.outputs.has_team == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        if: steps.team.outputs.has_team == 'true'
        run: npm ci

      - name: Upload to Vercel Blob
        if: steps.team.outputs.has_team == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            node scripts/upload-release.mjs ios apps/ios/dist/Anyloc.ipa
          else
            echo "BLOB_READ_WRITE_TOKEN absent — skip upload Blob"
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.team.outputs.has_team == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v0.1.${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Anyloc iOS v0.1.${{ github.run_number }}" --generate-notes
          gh release upload "$TAG" apps/ios/dist/Anyloc.ipa --clobber

      - name: Upload IPA artifact
        if: steps.team.outputs.has_team == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: anyloc-ios-ipa
          path: apps/ios/dist/Anyloc.ipa
          if-no-files-found: error
