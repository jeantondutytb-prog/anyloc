name: Anyloc
options:
  bundleIdPrefix: io.anyloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Anyloc:
    type: application
    platform: iOS
    sources:
      - Anyloc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.anyloc.app
        CODE_SIGN_ENTITLEMENTS: Anyloc/Anyloc.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Anyloc
    info:
      path: Anyloc/Info.plist
      properties:
        UILaunchScreen: {}
