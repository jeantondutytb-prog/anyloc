name: Anyloc
options:
  bundleIdPrefix: io.anyloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "L6WH68WM49"
targets:
  Anyloc:
    type: application
    platform: iOS
    sources:
      - Anyloc
    dependencies:
      # idevice (Rust) static lib — built by scripts/build-idevice-ios.sh
      - framework: Vendor/IDevice.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.anyloc.app
        CODE_SIGN_ENTITLEMENTS: Anyloc/Anyloc.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Anyloc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # IDevice.xcframework only ships an arm64 simulator slice.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: Anyloc/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Anyloc s'appuie sur la localisation pour rester actif en arrière-plan : c'est ce qui garde ta position simulée appliquée quand l'app est fermée. Ta vraie position n'est ni enregistrée ni envoyée."
        CFBundleURLTypes:
          - CFBundleURLName: io.anyloc.app
            CFBundleURLSchemes:
              - anyloc
