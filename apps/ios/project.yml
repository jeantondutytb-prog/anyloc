name: Anyloc
options:
  bundleIdPrefix: io.anyloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Anyloc:
    type: application
    platform: iOS
    sources:
      - Anyloc
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.anyloc.app
        INFOPLIST_KEY_CFBundleDisplayName: Anyloc
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Anyloc utilise ta position pour synchroniser le spoofing GPS.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Anyloc maintient ta position fictive en arrière-plan.
        INFOPLIST_KEY_UIBackgroundModes:
          - location
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Vendor/idevice
        OTHER_LDFLAGS:
          - $(inherited)
          - -lidevice_ffi
          - -lc++
          - -lz
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Vendor/idevice
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Vendor/idevice
        ENABLE_BITCODE: NO
    info:
      path: Anyloc/Info.plist
      properties:
        UILaunchScreen: {}
